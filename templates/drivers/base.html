{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Кабинет водителя{% endblock %}</title>
  <style>
    /* Чёрно-белый интерфейс (требование заказчика). Статус ТО несём значком и
       заливкой, а не цветом: ● сплошной чёрный — срочно, ◑ жирная рамка — скоро,
       ○ светло-серый — норма, – пунктир — нет данных. */
    :root {
      --bg: #ffffff; --card: #ffffff; --ink: #111111; --muted: #666666;
      --line: #cfcfcf; --accent: #111111; --accent-ink: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    .wrap { max-width: 520px; min-width: 320px; margin: 0 auto; padding: 16px; }
    header.app {
      background: var(--ink); color: var(--accent-ink);
      padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 2px solid #000;
    }
    header.app .vin { font-weight: 600; letter-spacing: .5px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 16px; margin: 0 0 16px;
    }
    h1 { font-size: 22px; margin: 0 0 16px; }
    h2 { font-size: 18px; margin: 0 0 10px; }
    label { display: block; font-weight: 600; margin: 0 0 6px; }
    input[type=text], input[type=password] {
      width: 100%; padding: 14px; font-size: 18px; border: 1px solid var(--line);
      border-radius: 10px; background: #fff; color: var(--ink);
    }
    input:focus, textarea:focus { outline: 2px solid #000; outline-offset: -1px; border-color: #000; }
    .field { margin: 0 0 16px; }
    .hint { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
    .errors { color: #000; font-weight: 600; font-size: 14px; margin: 6px 0 0; }
    button, .btn {
      display: block; width: 100%; padding: 16px; font-size: 18px; font-weight: 600;
      border: 1px solid #000; border-radius: 10px; background: #000; color: #fff;
      cursor: pointer; text-align: center; text-decoration: none;
    }
    button:hover, .btn:hover { background: #333; }
    button.secondary, .btn.secondary {
      background: #fff; color: #000; border: 1px solid var(--line);
    }
    button.secondary:hover, .btn.secondary:hover { background: #efefef; }
    .msg { padding: 12px 14px; border-radius: 10px; margin: 0 0 16px; font-size: 15px;
      background: #f4f4f4; color: var(--ink); border-left: 4px solid var(--muted); }
    .msg.error { border-left-color: #000; background: #ededed; font-weight: 600; }
    .msg.success { border-left-color: #000; background: #f7f7f7; }

    /* Крупный статус ТО: значок + заливка задают срочность без цвета. */
    .badge {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 14px; border-radius: 10px; font-weight: 700; font-size: 16px;
      width: 100%; text-align: center; border: 1px solid var(--line); background: #fff; color: #111;
    }
    .badge::before { font-size: 18px; }
    .badge.green  { background: #f2f2f2; color: #333; border-color: #ddd; }
    .badge.green::before  { content: "\25CB"; }
    .badge.yellow { background: #fff; color: #000; border: 2px solid #000; }
    .badge.yellow::before { content: "\25D1"; }
    .badge.red    { background: #000; color: #fff; border-color: #000; }
    .badge.red::before    { content: "\25CF"; }
    .badge.gray   { background: #fff; color: #777; border: 1px dashed #aaa; }
    .badge.gray::before   { content: "\2013"; }

    dl { margin: 0; }
    dl div { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); }
    dl div:last-child { border-bottom: none; }
    dt { color: var(--muted); }
    dd { margin: 0; text-align: right; font-weight: 600; }

    .steps { display: flex; gap: 6px; margin: 0 0 16px; }
    .steps span { flex: 1; height: 6px; border-radius: 3px; background: #e0e0e0; }
    .steps span.on { background: #000; }

    textarea {
      width: 100%; padding: 12px; font-size: 16px; border: 1px solid var(--line);
      border-radius: 10px; min-height: 96px; resize: vertical; background: #fff; color: var(--ink);
    }
    .radios label { display: flex; align-items: center; gap: 10px; font-weight: 500;
      padding: 12px; border: 1px solid var(--line); border-radius: 10px; margin: 0 0 8px; }
    .radios input { width: 20px; height: 20px; accent-color: #000; }

    .slot { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 0 0 12px; }
    .slot.filled { border: 2px solid #000; }
    .slot .cap { font-weight: 600; margin: 0 0 8px; display: flex; justify-content: space-between; }
    .slot .cap .ok { color: #000; font-size: 14px; font-weight: 700; }
    .slot .cap .ok::before { content: "\2713 "; }   /* ✓ */
    .slot .cap .need { color: #000; font-size: 14px; }
    .slot .cap .need::before { content: "\26A0 "; }  /* ⚠ */
    .thumb { width: 100%; max-height: 220px; object-fit: contain; border-radius: 8px;
      background: #f0f0f0; display: block; margin: 0 0 8px; filter: grayscale(100%); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid2 .slot { margin: 0; }
    .filebtn {
      display: block; text-align: center; padding: 12px; border: 1px dashed #000;
      border-radius: 10px; color: #000; font-weight: 600; cursor: pointer;
    }
    .filebtn input { display: none; }
    .rowbtns { display: flex; gap: 12px; margin-top: 8px; }
    .rowbtns button, .rowbtns .btn { flex: 1; }
    .linkdel { background: none; border: none; color: #000; font-size: 14px; text-decoration: underline;
      padding: 0; width: auto; display: inline; cursor: pointer; }
    .check-list { margin: 0; padding-left: 20px; color: #000; }
    .check-ok { color: #000; font-weight: 700; }
    .check-ok::before { content: "\2713 "; }
  </style>
  <script>
    // Отправить форму сразу после выбора файла (ход загрузки показывает браузер).
    document.addEventListener("change", function (e) {
      if (e.target.matches('input[type=file][data-autosubmit]')) {
        var btn = e.target.closest("form").querySelector('[data-submitlabel]');
        if (btn) { btn.textContent = "Загрузка…"; btn.disabled = true; }
        e.target.closest("form").submit();
      }
    });
  </script>
</head>
<body>
  {% block header %}{% endblock %}
  <main class="wrap">
    {% if messages %}
      {% for m in messages %}
        <div class="msg {% if m.tags %}{{ m.tags }}{% endif %}">{{ m }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
